<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>注册 - 人群密度监测系统</title>
    <style>
        /* 复用上面的样式，只需微调 */
        :root { --bg: #090e1b; --card: #121a2f; --neon: #00e5ff; --red: #ff3366; }
        body { background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .login-card { background: var(--card); padding: 40px; border-radius: 12px; width: 350px; text-align: center; box-shadow: 0 0 30px rgba(0, 229, 255, 0.1); border: 1px solid rgba(0, 229, 255, 0.2); }
        h2 { color: var(--neon); margin-bottom: 20px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 12px; color: #a0b1c5; }
        input { width: 100%; padding: 10px; border: 1px solid #334155; background: #0a0f18; color: white; border-radius: 6px; outline: none; }
        input:focus { border-color: var(--neon); }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; background: var(--neon); color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #00b3cc; }
        .link { color: #a0b1c5; font-size: 12px; margin-top: 15px; display: block; text-decoration: none;}
        .link:hover { color: var(--neon); }
        .error { color: var(--red); font-size: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>📝 用户注册</h2>
        {% if messages %}
            {% for message in messages %}
                <div class="error">{{ message }}</div>
            {% endfor %}
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="input-group">
                <label>用户名</label>
                <input type="text" name="username" required>
            </div>
            <div class="input-group">
                <label>密码</label>
                <input type="password" name="password1" required>
            </div>
            <div class="input-group">
                <label>确认密码</label>
                <input type="password" name="password2" required>
            </div>
            <button type="submit" class="btn">注册</button>
        </form>
        <a href="{% url 'login' %}" class="link">已有账号？返回登录</a>
    </div>
</body>
</html>
