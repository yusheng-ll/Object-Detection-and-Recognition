<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>目标检测与识别 - 检测中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #090e1b; --card: #121a2f; --neon: #00e5ff;
            --blue: #0099ff; --green: #00ff88; --orange: #ffaa00; --red: #ff3366;
            --text: #fff; --gray: #a0b1c5;
        }
        body { font-family: "Microsoft YaHei"; background: var(--bg); color: var(--text); padding: 0 20px 20px; }
        .nav {
            background: var(--card); padding: 20px; text-align: center; border-bottom: 1px solid rgba(0,229,255,0.2);
            margin-bottom: 30px;
        }
        .nav a {
            color: var(--neon); margin: 0 20px; text-decoration: none; font-size: 18px; transition: 0.3s;
        }
        .nav a:hover { color: var(--blue); }
        .container { max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 65% 33%; gap: 2%; }
        .card {
            background: var(--card); border-radius: 12px; padding: 24px; border: 1px solid rgba(0,229,255,0.15);
            box-shadow: 0 0 20px rgba(0,0,0,0.3); margin-bottom: 20px; transition: 0.3s;
        }
        .card:hover { border-color: var(--neon); }
        .card-title { font-size: 20px; color: var(--neon); margin-bottom: 20px; padding-left: 12px; border-left: 4px solid var(--blue); }
        .img-container {
            width: 100%; height: 500px; background: #0a101f; border-radius: 8px; position: relative;
            display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed rgba(0,229,255,0.3);
        }
        .img-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .heat-map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .empty-tip { color: var(--gray); }
        .loading { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 10; }
        .loader { width: 50px; height: 50px; border: 3px solid rgba(0,229,255,0.2); border-top: 3px solid var(--neon); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .btn-group { display: flex; gap: 15px; margin-top: 20px; }
        .btn { padding: 12px 30px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: 500; }
        .btn-primary { background: linear-gradient(90deg, #0099ff, #00e5ff); color: white; }
        .btn-warning { background: linear-gradient(90deg, #ffaa00, #ff6600); color: white; }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        #imgUpload { display: none; }
        .data-item { margin-bottom: 20px; }
        .data-label { color: var(--gray); font-size: 15px; margin-bottom: 8px; }
        .data-value { font-size: 32px; font-weight: bold; margin-bottom: 8px; }
        .progress-bar { width: 100%; height: 8px; background: #1a243a; border-radius: 4px; overflow: hidden; }
        .progress { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
        .badge { padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .badge-success { background: rgba(0,255,136,0.15); color: var(--green); }
        .badge-danger { background: rgba(255,51,102,0.15); color: var(--red); }
        .warn-item { padding: 12px 15px; border-radius: 6px; margin-bottom: 10px; background: rgba(26,36,58,0.6); border-left: 4px solid var(--red); }
        .warn-normal { border-left-color: var(--green); }
        .toast {
            position: fixed; top: 30px; right: 30px; padding: 14px 25px; background: var(--card);
            border-left: 4px solid var(--neon); border-radius: 6px; color: white; z-index: 999;
            transform: translateX(120%); transition: transform 0.3s ease;
        }
        .toast.show { transform: translateX(0); }

        /* 🔑 新增：类别统计样式 */
        .class-stats { margin-top: 15px; }
        .class-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; margin: 4px 0; border-radius: 6px;
            background: rgba(26,36,58,0.5); font-size: 14px;
        }
        .class-name { color: var(--text); }
        .class-count {
            background: var(--neon); color: #000;
            padding: 2px 10px; border-radius: 10px; font-weight: bold; font-size: 12px;
        }
        .ai-box {
            background: rgba(0,229,255,0.08); border-left: 3px solid var(--neon);
            padding: 15px; border-radius: 4px; line-height: 1.6; font-size: 14px;
        }
        .ai-title { font-weight: bold; color: var(--neon); margin-bottom: 8px; }
    </style>
</head>
<body>
    <div class="nav">
        <a href="/">首页</a>
        <a href="/detect/" class="active">图片检测</a>
        <a href="/video/">视频检测</a>
        <a href="/record/">历史记录</a>
        <a href="/agent/">智能体助手</a>
        <a href="/realtime/">实时摄像头检测</a>
    </div>

    <div class="toast" id="toast"></div>
    <div class="container">
        <div class="left">
            <div class="card">
                <h2 class="card-title">🎯 目标检测区域</h2>
                <div class="img-container" id="imgBox">
                    <div class="loading" id="loading"><div class="loader"></div></div>
                    <span class="empty-tip">请上传图片进行目标检测</span>
                    <img id="sourceImg" style="display: none;">
                    <img class="heat-map" id="heatImg" style="display: none;">
                </div>
                <div class="btn-group">
                    <button class="btn btn-primary" onclick="document.getElementById('imgUpload').click()">选择图片</button>
                    <input type="file" id="imgUpload" accept="image/*" style="display:none;">
                    <button class="btn btn-primary" onclick="startDetect()" id="detectBtn">开始检测</button>
                    <button class="btn btn-warning" onclick="resetPage()">重置清空</button>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="card">
                <h2 class="card-title">📊 检测统计</h2>
                <div class="data-item">
                    <div class="data-label">目标总数</div>
                    <div class="data-value" id="totalCount" style="color: var(--blue);">0</div>
                </div>
                <div class="data-item">
                    <div class="data-label">平均密度</div>
                    <div class="data-value" id="densityVal" style="color: var(--orange);">0.00</div>
                    <div style="color: var(--gray); font-size: 12px;">个/㎡</div>
                    <div class="progress-bar"><div class="progress" id="densityProgress" style="width: 0%; background: var(--orange);"></div></div>
                </div>
                <div class="data-item">
                    <div class="data-label">密度状态</div>
                    <div class="badge badge-success" id="statusBadge">正常</div>
                </div>

                <!-- 🔑 新增：类别统计区域 -->
                <div class="class-stats" id="classStatsBox" style="display: none;">
                    <div class="data-label">📋 类别分布</div>
                    <div id="classList"></div>
                </div>
            </div>

            <div class="card">
                <h2 class="card-title">⚠️ 异常告警</h2>
                <div id="warnList">
                    <div class="warn-item warn-normal"><div>系统正常运行中</div></div>
                </div>
            </div>

            <!-- 🤖 AI 分析面板 -->
            <div class="card">
                <h2 class="card-title">🤖 AI 智能分析</h2>
                <div id="aiAnalysis" class="ai-box">
                    请先上传图片进行检测，AI 将自动分析目标分布并给出专业建议...
                </div>
            </div>
        </div>
    </div>

<script>
    const imgUpload = document.getElementById('imgUpload');
    const sourceImg = document.getElementById('sourceImg');
    const loading = document.getElementById('loading');
    const toast = document.getElementById('toast');
    const densityProgress = document.getElementById('densityProgress');
    const aiAnalysis = document.getElementById('aiAnalysis');
    const detectBtn = document.getElementById('detectBtn');
    let recordList = JSON.parse(localStorage.getItem('detectRecords')) || [];

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(()=>toast.classList.remove('show'), 2500);
    }

    imgUpload.onchange = e => {
        const file = e.target.files[0];
        if(!file) return;
        sourceImg.src = URL.createObjectURL(file);
        sourceImg.style.display = 'block';
        document.querySelector('.empty-tip').style.display = 'none';
        showToast('图片已选择');
        // 重置分析内容
        aiAnalysis.innerHTML = '请点击开始检测，AI 将自动分析目标分布...';
        document.getElementById('classStatsBox').style.display = 'none';
    };

    async function startDetect() {
        if (!imgUpload.files[0]) {
            showToast("请先选择图片！");
            return;
        }

        detectBtn.disabled = true;
        detectBtn.innerHTML = '⏳ 分析中...';
        loading.style.display = "flex";

        try {
            let file = imgUpload.files[0];
            let formData = new FormData();
            formData.append("image", file);

            // 🔑 修改：使用新的 API 路径
            const res = await fetch("/api/detect/image/", {
                method: "POST",
                body: formData
            });

            const data = await res.json();
            loading.style.display = "none";

            if (data.code !== 200) {
                throw new Error(data.error || '检测失败');
            }

            // 🔑 修改：使用新字段名
            const total = data.total_count;
            const density = data.density;
            const isAbnormal = data.is_abnormal;
            const classStats = data.class_stats || {};

            // 更新统计数据
            document.getElementById("totalCount").innerText = total;
            document.getElementById("densityVal").innerText = density.toFixed(2);

            // 密度进度条（按密度值比例，最大 5 个/㎡为满）
            const progressWidth = Math.min((density / 5) * 100, 100);
            densityProgress.style.width = progressWidth + "%";

            // 状态徽章
            const badge = document.getElementById("statusBadge");
            if (isAbnormal || density > 3.0) {
                badge.className = "badge badge-danger";
                badge.innerText = "密度过高";
                document.getElementById("warnList").innerHTML = `
                    <div class="warn-item">
                        <div>⚠️ ${new Date().toLocaleTimeString()}：密度 ${density} 个/㎡，建议疏导</div>
                    </div>`;
            } else if (density > 2.0) {
                badge.className = "badge badge-warning";
                badge.innerText = "较密集";
                document.getElementById("warnList").innerHTML = `
                    <div class="warn-item" style="border-left-color: var(--orange);">
                        <div>📊 密度 ${density} 个/㎡，请关注人流变化</div>
                    </div>`;
            } else {
                badge.className = "badge badge-success";
                badge.innerText = "正常";
                document.getElementById("warnList").innerHTML = `
                    <div class="warn-item warn-normal"><div>✅ 状态正常</div></div>`;
            }

            // 🔑 显示带框结果图
            if (data.detected_img_url) {
                sourceImg.src = data.detected_img_url + '?t=' + Date.now(); // 防缓存
            }

            // 🔑 显示类别统计
            const classBox = document.getElementById('classStatsBox');
            const classList = document.getElementById('classList');
            if (Object.keys(classStats).length > 0) {
                classBox.style.display = 'block';
                classList.innerHTML = Object.entries(classStats)
                    .sort((a,b) => b[1] - a[1])  // 按数量降序
                    .map(([name, count]) => `
                        <div class="class-item">
                            <span class="class-name">${name}</span>
                            <span class="class-count">${count}</span>
                        </div>
                    `).join('');
            } else {
                classBox.style.display = 'none';
            }

            // 保存记录
            saveRecord({ total, density, status: badge.innerText, classStats });
            showToast("✅ 检测完成");

            // 🔑 显示 AI 分析（后端已返回，直接使用）
            if (data.ai_analysis) {
                const ai = data.ai_analysis;
                aiAnalysis.innerHTML = `
                    <div class="ai-title">📈 ${ai.risk_level}</div>
                    <p style="margin: 8px 0;">${ai.summary}</p>
                    <div class="ai-title" style="margin-top: 12px;">💡 建议</div>
                    <ul style="margin: 0; padding-left: 20px;">
                        ${ai.suggestions.map(s => `<li>${s}</li>`).join('')}
                    </ul>
                `;
            }

        } catch (err) {
            loading.style.display = "none";
            showToast("❌ " + err.message);
            console.error("检测错误:", err);
        } finally {
            detectBtn.disabled = false;
            detectBtn.innerHTML = '🚀 开始检测';
        }
    }

    function saveRecord(data) {
        const record = {
            time: new Date().toLocaleString(),
            total: data.total,
            density: data.density,
            status: data.status,
            classes: data.classStats || {},
            image: sourceImg.src
        };
        recordList.unshift(record);
        if(recordList.length > 20) recordList.pop();
        localStorage.setItem('detectRecords', JSON.stringify(recordList));
    }

    function resetPage() {
        sourceImg.style.display = 'none';
        sourceImg.src = '';
        imgUpload.value = '';
        document.querySelector('.empty-tip').style.display = 'block';

        document.getElementById('totalCount').innerText = '0';
        document.getElementById('densityVal').innerText = '0.00';
        densityProgress.style.width = '0%';

        const badge = document.getElementById('statusBadge');
        badge.className = 'badge badge-success';
        badge.innerText = '正常';

        document.getElementById('warnList').innerHTML =
            '<div class="warn-item warn-normal"><div>系统正常运行中</div></div>';

        document.getElementById('classStatsBox').style.display = 'none';
        aiAnalysis.innerHTML = '请先上传图片进行检测，AI 将自动分析目标分布并给出专业建议...';

        showToast('已重置');
    }
</script>
</body>
</html>
