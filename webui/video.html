<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>视频目标检测</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;}
        :root{--bg:#090e1b;--card:#121a2f;--neon:#00e5ff;--blue:#0099ff;--orange:#ffaa00;--red:#ff3366;--green:#00ff88;--text:#fff;--gray:#a0b1c5;}
        body{font-family:"Microsoft YaHei";background:var(--bg);color:var(--text);padding:0 20px 20px;}
        .nav{background:var(--card);padding:20px;text-align:center;border-bottom:1px solid rgba(0,229,255,0.2);margin-bottom:30px;}
        .nav a{color:var(--neon);margin:0 20px;text-decoration:none;font-size:18px;transition: 0.3s}
        .nav a:hover{color:var(--blue);}
        .container{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:65% 33%;gap:2%;}
        .card{background:var(--card);border-radius:12px;padding:24px;border:1px solid rgba(0,229,255,0.15);margin-bottom:20px;}
        .card-title{font-size:20px;color:var(--neon);margin-bottom:20px;padding-left:12px;border-left:4px solid var(--blue);}
        .img-container{width:100%;height:500px;background:#0a101f;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;position: relative;}
        .empty-tip{color:var(--gray);}
        .loading{position:absolute;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:10;}
        .loader{width:50px;height:50px;border:3px solid rgba(0,229,255,0.2);border-top:3px solid var(--neon);border-radius:50%;animation:spin 1s linear infinite;}
        @keyframes spin{0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}
        .btn-group{display:flex;gap:15px;margin-top:20px;flex-wrap:wrap;}
        .btn{padding:12px 30px;border:none;border-radius:6px;font-size:16px;cursor:pointer;transition: 0.2s}
        .btn-primary{background:linear-gradient(90deg,#0099ff,#00e5ff);color:white;}
        .btn-warning{background:linear-gradient(90deg,#ffaa00,#ff6600);color:white;}
        .btn:disabled{opacity:0.6;cursor: not-allowed;}
        #imgUpload{display:none;}
        .data-item{margin-bottom:20px;}
        .data-label{color:var(--gray);font-size:15px;}
        .data-value{font-size:32px;font-weight:bold;}
        .progress-bar{width:100%;height:8px;background:#1a243a;border-radius:4px;margin-top:6px;}
        .progress{height:100%;border-radius:4px;background:var(--orange);}
        .badge{padding:6px 16px;border-radius:20px;font-size:14px;}
        .badge-success{background:rgba(0,255,136,0.15);color:var(--green);}
        .badge-danger{background:rgba(255,51,102,0.15);color:var(--red);}
        .warn-item{padding:12px;background:rgba(26,36,58,0.6);border-left:4px solid var(--red);border-radius:6px;margin-bottom:8px;}
        .warn-normal{border-left-color:var(--green);}
        .toast{position:fixed;top:30px;right:30px;padding:14px 25px;background:var(--card);border-left:4px solid var(--neon);border-radius:6px;color:white;z-index:999;transform:translateX(120%);transition:0.3s;}
        .toast.show{transform:translateX(0);}
        video{width:100%;height:100%;border-radius: 8px; object-fit: contain; background:#000;}
        .chart-box{width:100%;height:220px;background:#121a2f;border-radius:8px;border:1px solid rgba(0,229,255,0.2);margin-top:10px;}
        #chart{width:100%;height:100%;}

        /* 🔑 新增：类别统计样式 */
        .class-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 8px 12px; margin: 4px 0; border-radius: 6px;
            background: rgba(26,36,58,0.5); font-size: 14px;
        }
        .class-name { color: var(--text); }
        .class-count {
            background: var(--neon); color: #000;
            padding: 2px 10px; border-radius: 10px; font-weight: bold; font-size: 12px;
        }
        .ai-box {
            background: rgba(0,229,255,0.08); border-left: 3px solid var(--neon);
            padding: 15px; border-radius: 4px; line-height: 1.6; font-size: 14px;
        }
        .ai-title { font-weight: bold; color: var(--neon); margin-bottom: 8px; }
    </style>
</head>
<body>
<div class="nav">
    <a href="/">首页</a>
    <a href="/detect/">图片检测</a>
    <a href="/video/" class="active">视频检测</a>
    <a href="/record/">历史记录</a>
    <a href="/agent/">智能体助手</a>
    <a href="/realtime/">实时摄像头检测</a>
</div>

<div class="toast" id="toast"></div>
<div class="container">
    <div class="left">
        <div class="card">
            <h2 class="card-title">🎬 视频目标检测</h2>
            <div class="img-container" id="imgBox">
                <div class="loading" id="loading"><div class="loader"></div></div>
                <span class="empty-tip">请上传视频进行检测</span>
            </div>
            <div class="btn-group">
                <input type="file" id="imgUpload" accept="video/*">
                <label for="imgUpload" class="btn btn-primary">选择视频</label>
                <button class="btn btn-primary" onclick="startDetect()" id="detectBtn">开始检测</button>
                <button class="btn btn-warning" onclick="resetPage()">重置</button>
            </div>
        </div>
        <div class="card">
            <h2 class="card-title">📈 实时人数变化曲线</h2>
            <div class="chart-box">
                <canvas id="chart"></canvas>
            </div>
        </div>
    </div>

    <div class="right">
        <!-- ✅ 修正：检测结果卡片 -->
        <div class="card">
            <h2 class="card-title">📊 检测结果</h2>
            <div class="data-item">
                <div class="data-label">平均目标数</div>
                <div class="data-value" id="peopleNum">0</div>
            </div>
            <div class="data-item">
                <div class="data-label">平均密度</div>
                <div class="data-value" id="densityVal">0.0</div>
                <div style="color: var(--gray); font-size: 12px;">个/㎡</div>
                <div class="progress-bar"><div id="densityProgress" class="progress" style="width:0%"></div></div>
            </div>
            <div class="data-item">
                <div class="data-label">密度状态</div>
                <div class="badge badge-success" id="crowdStatus">正常</div>
            </div>
        </div>

        <!-- ✅ 修正：类别分布卡片（独立出来） -->
        <div class="card">
            <h2 class="card-title">📋 类别分布</h2>
            <div id="videoClassStats">
                <p class="text-muted small">等待检测完成...</p>
            </div>
        </div>

        <div class="card">
            <h2 class="card-title">⚠️ 异常告警</h2>
            <div id="warnList">
                <div class="warn-item warn-normal">系统正常运行中</div>
            </div>
        </div>

        <!-- ✅ 修正：AI 分析卡片 -->
        <div class="card">
            <h2 class="card-title">🤖 AI 安全分析</h2>
            <div id="aiAnalysis" class="ai-box">
                请上传视频并完成检测，AI 将自动分析目标分布与安全建议...
            </div>
        </div>
    </div>
</div>

<script>
    const imgUpload = document.getElementById('imgUpload');
    const imgBox = document.getElementById('imgBox');
    const loading = document.getElementById('loading');
    const toast = document.getElementById('toast');
    const densityProgress = document.getElementById('densityProgress');
    const ctx = document.getElementById('chart').getContext('2d');
    const aiAnalysis = document.getElementById('aiAnalysis');
    const detectBtn = document.getElementById('detectBtn');
    let chart;

    function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2800);
    }

    // 初始化图表
    function initChart(data = []) {
        if(chart) chart.destroy();
        chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map((_, i) => (i+1) + 's'),
                datasets: [{
                    label: '实时人数',
                    data: data,
                    borderColor: '#00e5ff',
                    backgroundColor: 'rgba(0,229,255,0.15)',
                    borderWidth: 2,
                    tension: 0.3,
                    fill: true,
                    pointRadius: 1.5
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { labels: { color: '#fff' } } },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a0b1c5' } },
                    y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#a0b1c5' }, min:0 }
                }
            }
        });
    }

    imgUpload.onchange = e => {
        const file = e.target.files[0];
        if (!file) return;
        imgBox.innerHTML = `<video controls style="width:100%;height:100%;" src="${URL.createObjectURL(file)}"></video>`;
        initChart();
        aiAnalysis.innerHTML = '<p class="text-muted small">等待开始检测...</p>';
        document.getElementById('videoClassStats').innerHTML = '<p class="text-muted small">等待检测完成...</p>';
        showToast('视频已选择');
    };

    async function startDetect() {
        if (!imgUpload.files[0]) {
            showToast('请先选择视频！');
            return;
        }

        detectBtn.disabled = true;
        detectBtn.innerHTML = '⏳ 检测中...';
        loading.style.display = 'flex';

        try {
            const fd = new FormData();
            fd.append('video', imgUpload.files[0]);

            const res = await fetch('/api/detect/video/', { method: 'POST', body: fd });

            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            const data = await res.json();
            console.log('📦 后端返回数据:', data);

            if (data.code !== 200) throw new Error(data.error || '检测失败');

            // 1. 处理视频播放与下载
            if (data.video_url) {
                const videoUrl = data.video_url + "?t=" + new Date().getTime();

                // 尝试播放
                imgBox.innerHTML = `
                    <div style="position:relative; width:100%; height:100%;">
                        <video controls autoplay loop style="width:100%;height:100%; background:#000;">
                            <source src="${videoUrl}" type="video/mp4">
                            您的浏览器不支持播放此视频格式。
                        </video>
                        <!-- 备用下载链接 -->
                        <div style="position:absolute; bottom:10px; right:10px; z-index:20;">
                            <a href="${videoUrl}" download class="btn btn-primary" style="padding:5px 15px; font-size:12px;">📥 下载带框视频</a>
                        </div>
                    </div>
                `;
            }

            // 2. 更新基础统计
            document.getElementById('peopleNum').innerText = data.avg_people || 0;
            document.getElementById('densityVal').innerText = (data.avg_density || 0).toFixed(2);
            densityProgress.style.width = Math.min((data.avg_density / 5) * 100, 100) + '%';

            // 3. 更新状态
            const statusEl = document.getElementById('crowdStatus');
            const warnList = document.getElementById('warnList');
            const isCrowd = data.is_crowd || (data.avg_density > 3);

            if (isCrowd) {
                statusEl.className = 'badge badge-danger';
                statusEl.innerText = '密度过高';
                warnList.innerHTML = `<div class="warn-item">⚠️ 检测到高密度人群，建议疏导</div>`;
            } else if (data.avg_density > 2) {
                statusEl.className = 'badge badge-warning';
                statusEl.innerText = '较密集';
                warnList.innerHTML = `<div class="warn-item" style="border-left-color: var(--orange);">📊 密度较高，请关注</div>`;
            } else {
                statusEl.className = 'badge badge-success';
                statusEl.innerText = '正常';
                warnList.innerHTML = `<div class="warn-item warn-normal">✅ 状态正常</div>`;
            }

            // 4. 🔑 渲染类别分布（使用平均值，更合理）
            const classStatsDiv = document.getElementById('videoClassStats');
            if (classStatsDiv) {
                // 优先使用平均值数据
                const statsToDisplay = data.class_stats_avg && Object.keys(data.class_stats_avg).length > 0
                    ? data.class_stats_avg
                    : data.class_stats_total;

                if (statsToDisplay && Object.keys(statsToDisplay).length > 0) {
                    const totalDetections = data.total_detections || 0;
                    const sampledFrames = data.sample_count || 1;

                    let html = `
                        <div style="margin-bottom: 10px; font-size: 12px; color: var(--gray);">
                            📊 共采样 <strong>${sampledFrames}</strong> 帧，累计检测 <strong>${totalDetections}</strong> 次
                        </div>
                        <div style="max-height: 200px; overflow-y: auto;">
                    `;

                    Object.entries(statsToDisplay)
                        .sort((a, b) => b[1] - a[1])
                        .forEach(([clsName, count]) => {
                            // 如果是平均值，显示 "/帧"
                            const displayText = (data.class_stats_avg && data.class_stats_avg[clsName] !== undefined)
                                ? `${count.toFixed(2)} /帧`
                                : count;

                            html += `
                                <div class="class-item">
                                    <span class="class-name">${clsName}</span>
                                    <span class="class-count">${displayText}</span>
                                </div>
                            `;
                        });
                    html += '</div>';
                    classStatsDiv.innerHTML = html;
                } else {
                    classStatsDiv.innerHTML = '<p class="text-muted small">未检测到任何目标类别</p>';
                }
            }

            // 5. 渲染 AI 分析
            if (data.ai_analysis) {
                const ai = data.ai_analysis;
                aiAnalysis.innerHTML = `
                    <div class="ai-title">📈 ${ai.risk_level}</div>
                    <p style="margin: 8px 0;">${ai.summary}</p>
                    <div class="ai-title" style="margin-top: 12px;">💡 建议</div>
                    <ul style="margin: 0; padding-left: 20px;">
                        ${ai.suggestions.map(s => `<li>${s}</li>`).join('')}
                    </ul>
                `;
            }

            // 6. 更新曲线图
            if (data.density_timeline && data.density_timeline.length > 0) {
                const counts = data.density_timeline.map(d => d.count);
                initChart(counts);
            }

        } catch (err) {
            console.error('❌ 检测错误:', err);
            showToast('❌ ' + err.message);
        } finally {
            loading.style.display = 'none';
            detectBtn.disabled = false;
            detectBtn.innerHTML = '🚀 开始检测';
        }
    }

    function resetPage() {
        imgBox.innerHTML = '<span class="empty-tip">请上传视频进行检测</span>';
        imgUpload.value = '';
        document.getElementById('peopleNum').innerText = '0';
        document.getElementById('densityVal').innerText = '0.0';
        densityProgress.style.width = '0%';
        document.getElementById('crowdStatus').className = 'badge badge-success';
        document.getElementById('crowdStatus').innerText = '正常';
        document.getElementById('warnList').innerHTML = '<div class="warn-item warn-normal">系统正常运行中</div>';
        document.getElementById('videoClassStats').innerHTML = '<p class="text-muted small">等待检测完成...</p>';
        aiAnalysis.innerHTML = '<p class="text-muted small">请上传视频并完成检测，AI 将自动分析目标分布与安全建议...</p>';
        initChart();
        showToast('已重置');
    }

    window.onload = function() { initChart(); }
</script>
</body>
</html>
